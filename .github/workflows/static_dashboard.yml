name: Static Dashboard

# Runs a benchmark, builds the static dashboard from its results and uploads it
# as the dashboard-site artifact. The default inputs are a few-minute smoke run
# on a GitHub-hosted runner, so a fork can try the workflow without its own
# hardware. Deploying to GitHub Pages is off unless both the deploy_pages input
# and the STATIC_DASHBOARD_PAGES repository variable say so.

on:
  # TEMPORARY: registers the workflow on this branch so it can be dispatched
  # before it reaches the default branch. Its push run skips every job.
  push:
    branches: [static-dashboard]
    paths: [.github/workflows/static_dashboard.yml]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (ubuntu-latest, or a self-hosted label)"
        required: false
        default: "ubuntu-latest"
        type: string
      config:
        description: "Benchmark config file"
        required: false
        default: "configs/dashboard-smoke.json"
        type: string
      commits:
        description: "Valkey commits or refs to benchmark, space-separated"
        required: false
        default: "unstable"
        type: string
      num_runs:
        description: "Runs per configuration"
        required: false
        default: "2"
        type: string
      deploy_pages:
        description: "Deploy the site to GitHub Pages (also needs repo variable STATIC_DASHBOARD_PAGES=true)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@3605726ffa6ef7750b99ff496e5b88248b414e26 # v4.9.0
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install --require-hashes -r requirements.txt

      - name: Run benchmark
        env:
          CONFIG: ${{ inputs.config }}
          COMMITS: ${{ inputs.commits }}
          NUM_RUNS: ${{ inputs.num_runs }}
        run: |
          read -ra commits <<< "$COMMITS"
          python benchmark.py \
            --config "$CONFIG" \
            --commits "${commits[@]}" \
            --runs "$NUM_RUNS" \
            --results-dir results

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: results/

      - name: Build and upload static dashboard
        uses: ./.github/actions/static-dashboard
        with:
          title: Valkey benchmark (${{ inputs.commits }})

  deploy-pages:
    # Off by default: needs the input AND the repository variable.
    if: inputs.deploy_pages && vars.STATIC_DASHBOARD_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dashboard site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dashboard-site
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
